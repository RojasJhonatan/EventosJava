spring.application.name=conciertos
server.port=8080

# Datos de conexión a la base de datos
spring.datasource.url=jdbc:mysql://localhost:3330/mvc_tickets_eventos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
# ddl-auto: 'update' crea o actualiza las tablas automáticamente según tus clases @Entity
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.error.include-message=always
server.error.include-exception=true
server.error.include-stacktrace=always